<!doctype html>
<html lang="bg"><head><meta charset="utf-8">
[[fonts]]
<style>
[[css]]
[[phonecss]]
html,body{margin:0;width:1600px;height:1200px;overflow:hidden}
body{position:relative;background:
  radial-gradient(40% 50% at 48% 47%,rgba(255,246,240,.95) 0%,rgba(255,246,240,0) 100%),
  radial-gradient(50% 60% at 94% 6%,rgba(206,188,222,.95) 0%,rgba(206,188,222,0) 72%),
  radial-gradient(55% 60% at 0% 100%,rgba(214,168,152,.75) 0%,rgba(214,168,152,0) 72%),
  radial-gradient(120% 120% at 50% 50%,rgba(0,0,0,0) 55%,rgba(98,58,78,.16) 100%),
  linear-gradient(160deg,#EEDFE3 0%,#ECD8D0 55%,#E2C8BF 100%)}
.grain{position:absolute;inset:0;background-image:var(--grain);opacity:.9}
.bigwheel{position:absolute;width:1400px;height:1400px;left:100px;top:-100px;opacity:.13}
.bigwheel svg{width:100%;height:100%}
.sky{position:absolute;inset:0}
.browser{position:absolute;left:396px;top:168px;width:1128px;border-radius:16px;overflow:hidden;background:#FBF7F3;z-index:2;
  box-shadow:0 0 0 1px rgba(42,23,48,.10),0 60px 110px -50px rgba(42,23,48,.55),0 24px 50px -30px rgba(42,23,48,.35)}
.bar{height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;background:linear-gradient(#F4EDE8,#EDE3DD);border-bottom:1px solid rgba(42,23,48,.08)}
.bar i{width:11px;height:11px;border-radius:50%;background:#E2B4A8}
.bar i:nth-child(2){background:#E9D0A4}.bar i:nth-child(3){background:#BFD3B8}
.url{margin-left:auto;margin-right:auto;transform:translateX(-30px);height:24px;width:360px;border-radius:8px;background:#FFFCF9;border:1px solid rgba(42,23,48,.08);display:flex;align-items:center;justify-content:center;gap:6px;font:600 12.5px var(--sans);color:var(--ink-2)}
.browser img{display:block;width:1128px;height:705px}
.p-hero{--s:1.13;left:96px;top:112px;z-index:4}
.sp-a{position:absolute;color:#B5503A}
</style></head>
<body>
<div class="sky">[[starfield:board]]</div>
<div class="bigwheel">[[wheel:board]]</div>
<div class="browser"><div class="bar"><i></i><i></i><i></i><span class="url">[[icon:lock:12]]astromia.eu</span></div><img src="[[shot]]desktop-vp.png" alt=""></div>
<div class="phone p-hero">
  <div class="scr">
    <div class="island"></div>
    <div class="sb"><span>9:41</span>[[sbicons]]</div>
    <img class="shot" src="[[shot]]home-vp3.png" alt="">
    <div class="homebar"></div>
    <div class="glare"></div>
  </div>
</div>
<span class="sp-a" style="left:1490px;top:110px">[[sp:26]]</span>
<span class="sp-a" style="left:1450px;top:80px;opacity:.6">[[sp:12]]</span>
<div class="grain"></div>
</body></html>
